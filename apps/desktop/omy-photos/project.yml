name: OmyPhotos
options:
  bundleIdPrefix: dev.kevinstack
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
targets:
  OmyPhotos:
    type: application
    platform: macOS
    sources:
      - path: OmyPhotos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kevinstack.omyphotos
        INFOPLIST_KEY_CFBundleDisplayName: Omy Photos
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Kevin
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: "$(inherited) -framework ImageCaptureCore -lsqlite3"
  OmyPhotosTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OmyPhotosTests
    dependencies:
      - target: OmyPhotos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kevinstack.omyphotos.tests
        GENERATE_INFOPLIST_FILE: YES
