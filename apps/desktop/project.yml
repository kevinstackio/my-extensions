name: exts
options:
  bundleIdPrefix: dev.linguio
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
targets:
  exts:
    type: application
    platform: macOS
    sources:
      - path: src
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.linguio.exts
        ASSETCATALOG_COMPILER_APPICON_NAME: exts
        INFOPLIST_KEY_CFBundleDisplayName: Exts
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Kevin
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: "$(inherited) -framework ImageCaptureCore -lsqlite3"
  extsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: tests/modules/media
    dependencies:
      - target: exts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.linguio.exts.tests
        GENERATE_INFOPLIST_FILE: YES
