name: OhMyPhotos
options:
  bundleIdPrefix: dev.kevinstack
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
targets:
  OhMyPhotos:
    type: application
    platform: macOS
    sources:
      - path: src
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kevinstack.ohmy-photos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: OhMy Photos
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Kevin
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: "$(inherited) -framework ImageCaptureCore -lsqlite3"
  OhMyPhotosTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OhMyPhotosTests
    dependencies:
      - target: OhMyPhotos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kevinstack.ohmyphotos.tests
        GENERATE_INFOPLIST_FILE: YES
